<style>
/* ---- Reset ---- */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
img, svg { display: block; }
button, input, select, textarea { font-family: inherit; }

/* ---- Tokens ---- */
:root {
  --ink:    #1A1410;   /* warm near-black for body */
  --sand:   #F4ECDD;   /* warm cream paper */
  --tide:   #1a3a2e;
  --wave:   #1D9E75;   /* functional accent (in-season dots, links) */
  --wave-d: #0F6E56;   /* italic accent word */
  --mist:   #8a7f72;   /* warmer mist, sits on cream */
  --salt:   #E8DEC9;   /* warm input border */
  --deep:   #0a1f17;   /* hero kept dark green for contrast */
  --oxblood:#6B1F2A;   /* headlines, rules, badges */
  --rust:   #D89A2C;   /* SAFFRON dot — only as punctuation */
  --serif:  'DM Serif Display', Georgia, serif;
  --mono:   'DM Mono', 'Courier New', monospace;
  --border: rgba(107,31,42,0.35);
  --border-light: rgba(244,236,221,0.12);
  --ease:   cubic-bezier(0.25, 0.46, 0.45, 0.94);
}

/* ---- Base ---- */
body {
  background: var(--sand);
  color: var(--ink);
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ---- Utilities ---- */
.overline {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--wave);
}
.overline--ghost { color: rgba(255,255,255,0.30); }

.serif-display {
  font-family: var(--serif);
  line-height: 1.10;
  letter-spacing: -0.02em;
}

/* ---- Oxblood headline pass ---- */
.section__h,
.cal-card__dest,
.swell-info__name,
.modal__title,
.ethos-mission__h { color: var(--oxblood); }
.ethos-mission__h em { color: var(--wave-d); }
.section--ethos .section__h em { color: var(--wave-d); }

/* ---- NAV ---- */
.nav {
  position: sticky;
  top: 0;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 40px;
  height: 60px;
  background: var(--sand);
  border-bottom: 1px solid var(--border);
  transition: background 0.3s var(--ease);
}
.nav__logo {
  font-family: var(--serif);
  font-size: 20px;
  letter-spacing: -0.03em;
  color: var(--ink);
  text-decoration: none;
}
.nav__logo span { color: var(--rust); }

.nav__links {
  display: flex;
  gap: 32px;
  list-style: none;
}
.nav__links a {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mist);
  text-decoration: none;
  transition: color 0.2s, opacity 0.2s;
}
.nav__links a:hover { color: var(--ink); opacity: 1; }

.nav__hamburger {
  display: none;
  flex-direction: column;
  gap: 5px;
  cursor: pointer;
  background: none;
  border: none;
  padding: 4px;
}
.nav__hamburger span {
  display: block;
  width: 24px;
  height: 1px;
  background: var(--ink);
  transition: transform 0.3s var(--ease), opacity 0.3s;
}
.nav__hamburger.open span:nth-child(1) { transform: translateY(6px) rotate(45deg); }
.nav__hamburger.open span:nth-child(2) { opacity: 0; }
.nav__hamburger.open span:nth-child(3) { transform: translateY(-6px) rotate(-45deg); }

.nav__drawer {
  display: none;
  position: fixed;
  top: 60px; left: 0; right: 0; bottom: 0;
  background: var(--sand);
  z-index: 99;
  padding: 48px 40px;
  flex-direction: column;
  gap: 32px;
}
.nav__drawer.open { display: flex; }
.nav__drawer a {
  font-family: var(--serif);
  font-size: 36px;
  color: var(--ink);
  text-decoration: none;
  letter-spacing: -0.02em;
}
.nav__drawer a:hover { color: var(--wave); }

/* ---- HERO ---- */
.hero {
  position: relative;
  background: var(--deep);
  min-height: calc(100vh - 60px);
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}
.hero__art {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  opacity: 0.45;
  z-index: 0;
  pointer-events: none;
}
.hero__inner {
  position: relative;
  z-index: 2;
  padding: 80px 64px 48px;
  max-width: 880px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 36px;
}
.hero__kicker {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--wave);
  margin: 0;
}
.hero__h1 {
  font-family: var(--serif);
  font-size: clamp(40px, 6vw, 76px);
  line-height: 1.05;
  color: #fff;
  letter-spacing: -0.03em;
  margin: 0;
}
.hero__h1 em {
  color: var(--wave);
  font-style: italic;
}
.hero__sub {
  font-family: var(--mono);
  font-size: 14px;
  line-height: 1.6;
  color: rgba(255,255,255,0.55);
  max-width: 540px;
  margin: 0;
}
.hero__meta {
  position: relative;
  z-index: 2;
  padding: 0 64px 56px;
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 32px;
  flex-wrap: wrap;
}
.hero__coords {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  color: rgba(255,255,255,0.32);
  margin: 0;
}
.hero__stat {
  display: flex;
  align-items: baseline;
  gap: 14px;
}
.hero__stat-n {
  font-family: var(--serif);
  font-size: clamp(44px, 5vw, 64px);
  color: #fff;
  line-height: 1;
  letter-spacing: -0.04em;
}
.hero__stat-l {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.40);
  max-width: 120px;
  line-height: 1.4;
}

/* ---- HERO LIVE PULSE ---- */
.hero__pulse {
  padding: 16px 18px;
  border: 1px solid rgba(29,158,117,0.30);
  border-radius: 2px;
  background: rgba(10,31,23,0.55);
  backdrop-filter: blur(2px);
  max-width: 460px;
  font-family: var(--mono);
  color: rgba(255,255,255,0.80);
}
.hero__pulse-head {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: rgba(255,255,255,0.55);
  margin-bottom: 14px;
}
.hero__pulse-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--wave);
  box-shadow: 0 0 0 0 rgba(29,158,117,0.55);
  animation: hero-pulse 2.4s ease-out infinite;
  flex-shrink: 0;
}
@keyframes hero-pulse {
  0%   { box-shadow: 0 0 0 0   rgba(29,158,117,0.55); }
  70%  { box-shadow: 0 0 0 10px rgba(29,158,117,0); }
  100% { box-shadow: 0 0 0 0   rgba(29,158,117,0); }
}
@media (prefers-reduced-motion: reduce) {
  .hero__pulse-dot { animation: none; }
}
.hero__pulse-sep {
  opacity: 0.45;
}
.hero__pulse-count {
  font-family: var(--serif);
  font-size: 26px;
  line-height: 1.1;
  color: #fff;
  letter-spacing: -0.02em;
  margin-bottom: 4px;
}
.hero__pulse-count em {
  color: var(--wave);
  font-style: italic;
}
.hero__pulse-list {
  font-size: 11px;
  letter-spacing: 0.04em;
  color: rgba(255,255,255,0.65);
  line-height: 1.5;
}
.hero__pulse-list a {
  color: rgba(255,255,255,0.65);
  text-decoration: none;
  border-bottom: 1px dotted rgba(255,255,255,0.25);
  transition: color 0.2s, border-color 0.2s;
}
.hero__pulse-list a:hover {
  color: var(--wave);
  border-bottom-color: var(--wave);
}

/* ---- HERO COMPASS (decorative) ---- */
.hero__compass {
  position: absolute;
  top: 7%;
  right: 6%;
  width: clamp(200px, 24vw, 340px);
  height: clamp(200px, 24vw, 340px);
  pointer-events: none;
  opacity: 0.65;
  z-index: 1;
}
.hero__compass-rose {
  width: 100%;
  height: 100%;
  animation: compass-rotate 180s linear infinite;
  transform-origin: center;
}
.hero__compass-needle {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  animation: compass-needle 240s linear infinite;
  transform-origin: center;
}
@keyframes compass-rotate {
  from { transform: rotate(0deg); }
  to   { transform: rotate(360deg); }
}
@keyframes compass-needle {
  from { transform: rotate(0deg); }
  to   { transform: rotate(-360deg); }
}
@media (prefers-reduced-motion: reduce) {
  .hero__compass-rose,
  .hero__compass-needle { animation: none; }
}

/* ---- CALENDAR SECTION ---- */
.section--calendar {
  padding: 80px 0 0;
  background: var(--sand);
}
.section__intro {
  padding: 0 40px 48px;
}
.section__h { font-size: clamp(28px, 3vw, 40px); margin-top: 14px; }
.section__sub {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--mist);
  max-width: 540px;
  margin-top: 14px;
  line-height: 1.75;
}

/* ---- CALENDAR (mobile-first month strip + expanded card) ---- */
.cal-strip {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 6px;
  padding: 0 24px;
  margin-bottom: 18px;
}
@media (min-width: 720px) {
  .cal-strip { grid-template-columns: repeat(12, 1fr); padding: 0 40px; gap: 4px; }
}
.cal-chip {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 14px 4px 12px;
  min-height: 56px;
  background: #fefdfb;
  border: 1px solid var(--border);
  border-radius: 4px;
  cursor: pointer;
  user-select: none;
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease), transform 0.18s var(--ease);
  -webkit-tap-highlight-color: transparent;
  font: inherit;
  color: inherit;
  text-align: center;
}
.cal-chip:hover { background: #f5f0e8; }
.cal-chip:focus-visible { outline: 2px solid var(--wave); outline-offset: 2px; }
.cal-chip__month {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--ink);
  line-height: 1;
}
.cal-chip__dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: rgba(14,14,14,0.15);
}
.cal-chip--peak .cal-chip__dot { background: var(--wave); }
.cal-chip--strong .cal-chip__dot { background: var(--wave); opacity: 0.55; }
.cal-chip--mild .cal-chip__dot   { background: var(--wave); opacity: 0.30; }
.cal-chip--now {
  border-color: var(--wave);
}
.cal-chip--now::before {
  content: 'NOW';
  position: absolute;
  top: -7px;
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.18em;
  background: var(--wave);
  color: #fff;
  padding: 2px 6px;
  border-radius: 2px;
  line-height: 1;
}
.cal-chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  transform: translateY(-1px);
}
.cal-chip.is-active .cal-chip__month { color: #fff; }
.cal-chip.is-active .cal-chip__dot { background: var(--wave); opacity: 1; }

/* Expanded card */
.cal-card {
  margin: 0 24px;
  background: var(--sand);
  border: 1px solid var(--border);
  border-radius: 4px;
  padding: 22px 22px 24px;
  cursor: pointer;
  transition: background 0.2s var(--ease), border-color 0.2s var(--ease);
}
@media (min-width: 720px) {
  .cal-card { margin: 0 40px; padding: 28px 32px 30px; }
}
.cal-card:hover { border-color: var(--ink); }
.cal-card__head {
  display: flex;
  align-items: baseline;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 4px;
}
.cal-card__month {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mist);
}
.cal-card__dest {
  font-family: var(--serif);
  font-size: clamp(24px, 4vw, 30px);
  color: var(--ink);
  line-height: 1.1;
  letter-spacing: -0.01em;
}
.cal-card__region {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--mist);
  margin-bottom: 14px;
}
.cal-card__row {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 14px;
}
.cal-card__swell { display: flex; gap: 3px; }
.cal-card__bar {
  width: 5px;
  height: 16px;
  border-radius: 2px;
  background: rgba(14,14,14,0.10);
}
.cal-card__bar--on { background: var(--wave); }
.cal-card__pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 10px 4px;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  line-height: 1;
}
.cal-card__pill::before {
  content: '';
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: currentColor;
  opacity: 0.85;
}
.cal-card__pill--beginner     { background: rgba(29,158,117,0.14); color: var(--wave-d); }
.cal-card__pill--intermediate { background: rgba(14,14,14,0.06);   color: var(--ink); }
.cal-card__pill--advanced     { background: var(--ink);            color: #fff; }
.cal-card__pill--all          { background: transparent;            color: var(--mist); border: 1px solid var(--border); }
.cal-card__forwho {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--ink);
  line-height: 1.65;
  margin-bottom: 14px;
}
.cal-card__link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--wave-d);
  text-decoration: none;
  padding-top: 4px;
  border-top: 1px solid var(--border);
  width: 100%;
}
.cal-card__link::after { content: '↗'; font-size: 14px; }

/* Calendar → Program bridge (subtle CTA below the card) */
.cal-program-link {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
  margin: 18px 24px 0;
  padding: 14px 18px;
  border: 1px dashed var(--border);
  border-radius: 4px;
  background: transparent;
  text-decoration: none;
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
}
@media (min-width: 720px) {
  .cal-program-link { margin: 22px 40px 0; padding: 16px 22px; }
}
.cal-program-link:hover {
  background: rgba(29,158,117,0.05);
  border-color: var(--wave-d);
}
.cal-program-link__copy {
  font-family: var(--mono);
  font-size: 12px;
  color: var(--ink);
  line-height: 1.5;
}
.cal-program-link__copy em {
  color: var(--wave-d);
  font-style: normal;
  font-weight: 500;
}
.cal-program-link__cta {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--wave-d);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.cal-program-link__cta::after { content: '→'; font-size: 14px; }

/* Calendar level filter (Beginner / Intermediate / Experienced) */
.cal-level-filter {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 22px;
}
.cal-level-filter__lbl {
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--mist);
  margin-right: 4px;
}
.cal-level-filter__btn {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 7px 14px 6px;
  cursor: pointer;
  transition: background 0.18s var(--ease), color 0.18s var(--ease), border-color 0.18s var(--ease);
}
.cal-level-filter__btn:hover { background: rgba(14,14,14,0.04); }
.cal-level-filter__btn.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.cal-level-filter__btn:focus-visible { outline: 2px solid var(--wave); outline-offset: 2px; }

/* Alternates row inside the calendar card */
.cal-card__alts {
  margin-top: 14px;
  padding-top: 14px;
  border-top: 1px dashed var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
}
.cal-card__alts-lbl {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--mist);
  margin-right: 4px;
}
.cal-card__alt-chip {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--ink);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 5px 12px 4px;
  cursor: pointer;
  transition: background 0.18s var(--ease), border-color 0.18s var(--ease);
}
.cal-card__alt-chip:hover {
  background: rgba(14,14,14,0.04);
  border-color: var(--ink);
}
.cal-card__alt-chip.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.cal-card__empty {
  font-family: var(--mono);
  font-size: 13px;
  color: var(--mist);
  font-style: italic;
  line-height: 1.65;
}

/* ---- SWELL MAP ---- */
.section--swell {
  background: var(--sand);
  padding: 80px 0 60px;
  position: relative;
  z-index: 2;
  margin-top: -32px;
  border-top-left-radius: 28px;
  border-top-right-radius: 28px;
  box-shadow: 0 -8px 24px rgba(10,31,23,0.18);
}
@media (max-width: 720px) {
  .section--swell {
    margin-top: -20px;
    border-top-left-radius: 20px;
    border-top-right-radius: 20px;
  }
}
.section--swell .section__intro { padding: 0 40px 48px; }

.swell-map-wrap {
  position: relative;
  max-width: 1120px;
  margin: 0 auto;
  padding: 0 40px;
}

.swell-map {
  width: 100%;
  max-width: 1040px;
  height: clamp(360px, 56vw, 580px);
  display: block;
  border: 1px solid var(--border);
  background: #dfe9ee;
  margin: 0 auto;
  border-radius: 4px;
  overflow: hidden;
}

.swell-map-note {
  font-family: var(--mono);
  font-size: 10px;
  color: var(--mist);
  letter-spacing: 0.12em;
  margin: 12px 0 0;
}

/* ---- Leaflet container tweaks ---- */
.leaflet-container {
  font-family: var(--mono);
  font-size: 10px;
  background: #dfe9ee;
}
.leaflet-container a { color: var(--wave-d); }
.leaflet-control-attribution {
  font-size: 9px !important;
  background: rgba(255,255,255,0.78) !important;
  padding: 2px 6px !important;
  letter-spacing: 0;
}
.leaflet-bar a {
  background: #fff;
  color: var(--ink);
  border-bottom: 1px solid var(--border) !important;
}
.leaflet-bar a:hover { background: var(--sand); }
.leaflet-touch .leaflet-bar a { width: 32px; height: 32px; line-height: 32px; }

/* ---- Reference city markers (Bangalore / Chennai / Colombo) ---- */
.swell-map-ref-icon {
  pointer-events: none;
}
.swell-map-ref-icon .ref-dot {
  position: absolute;
  top: 0; left: 0;
  transform: translate(-50%, -50%);
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: var(--ink);
  opacity: 0.55;
}
.swell-map-ref-icon .ref-label {
  position: absolute;
  top: 0;
  left: 8px;
  transform: translateY(-50%);
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.10em;
  text-transform: uppercase;
  color: var(--mist);
  white-space: nowrap;
  background: rgba(255,255,255,0.82);
  padding: 1px 5px;
  border-radius: 2px;
}
.swell-map-ref-icon--home .ref-home {
  position: absolute;
  top: 0;
  left: 0;
  transform: translate(-50%, -50%);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--wave);
  color: #fff;
  box-shadow: 0 0 0 2px #fff, 0 1px 4px rgba(10,31,23,0.30);
}
.swell-map-ref-icon--home .ref-home svg {
  display: block;
}

/* ---- Surf-spot pins (Leaflet divIcons) ---- */
.swell-pin-wrap { background: transparent !important; border: 0 !important; }
.swell-map-pin {
  position: relative;
  width: 44px;
  height: 44px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.swell-map-pin .pin-dot {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--wave);
  border: 2px solid #fff;
  box-shadow: 0 1px 4px rgba(10,31,23,0.30);
  transition: transform 0.2s var(--ease), background 0.2s, border-color 0.2s;
}
.swell-map-pin .pin-pulse {
  position: absolute;
  top: 50%; left: 50%;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--wave);
  opacity: 0.4;
  pointer-events: none;
  animation: pin-pulse 2.4s ease-out infinite;
}
@keyframes pin-pulse {
  0%   { transform: translate(-50%, -50%) scale(0.6); opacity: 0.55; }
  100% { transform: translate(-50%, -50%) scale(3.2); opacity: 0; }
}
.swell-map-pin .pin-label {
  position: absolute;
  bottom: calc(50% + 12px);
  left: 50%;
  transform: translateX(-50%);
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.04em;
  color: var(--ink);
  white-space: nowrap;
  background: rgba(255,255,255,0.88);
  padding: 2px 6px;
  border-radius: 3px;
  pointer-events: none;
  box-shadow: 0 1px 2px rgba(10,31,23,0.10);
}
.swell-map-pin--off .pin-dot {
  background: var(--mist);
  opacity: 0.7;
}
.swell-map-pin--off .pin-label {
  color: var(--mist);
  background: rgba(255,255,255,0.78);
}
.swell-map-pin:hover .pin-dot {
  transform: translate(-50%, -50%) scale(1.2);
}
.swell-map-pin.active .pin-dot {
  background: var(--wave-d);
  transform: translate(-50%, -50%) scale(1.35);
}
.swell-map-pin--off.active .pin-dot {
  background: var(--ink);
  border-color: var(--wave-d);
}
.swell-map-pin--off.active .pin-label {
  color: var(--ink);
  background: rgba(255,255,255,0.95);
}
@media (prefers-reduced-motion: reduce) {
  .swell-map-pin .pin-pulse { animation: none; opacity: 0.25; }
}

/* Skill-level filter */
.swell-map-filter {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin: 0 0 14px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--mist);
}
.swell-map-filter__label { margin-right: 4px; }
.swell-map-filter__btn {
  font: inherit;
  letter-spacing: inherit;
  text-transform: inherit;
  padding: 7px 12px;
  min-height: 32px;
  background: #fff;
  color: var(--ink);
  border: 1px solid var(--border);
  border-radius: 999px;
  cursor: pointer;
  transition: background 0.15s var(--ease), border-color 0.15s var(--ease), color 0.15s var(--ease);
  -webkit-tap-highlight-color: transparent;
}
.swell-map-filter__btn:hover { border-color: var(--ink); }
.swell-map-filter__btn.is-active {
  background: var(--ink);
  border-color: var(--ink);
  color: #fff;
}
.swell-map-wrap[data-filter="beginner"]     .swell-map-pin:not([data-levels~="beginner"]),
.swell-map-wrap[data-filter="intermediate"] .swell-map-pin:not([data-levels~="intermediate"]),
.swell-map-wrap[data-filter="advanced"]     .swell-map-pin:not([data-levels~="advanced"]) {
  opacity: 0.18;
  pointer-events: none;
}
.swell-map-wrap[data-filter="beginner"]     .swell-map-pin:not([data-levels~="beginner"]) .pin-pulse,
.swell-map-wrap[data-filter="intermediate"] .swell-map-pin:not([data-levels~="intermediate"]) .pin-pulse,
.swell-map-wrap[data-filter="advanced"]     .swell-map-pin:not([data-levels~="advanced"]) .pin-pulse {
  display: none;
}

/* In-season ribbon above the map */
.swell-map-now {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
  font-family: var(--mono);
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--mist);
  margin: 0 0 14px;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 2px;
  background: #fff;
}
.swell-map-now__dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--wave);
  box-shadow: 0 0 0 4px rgba(29,158,117,0.18);
  flex-shrink: 0;
}
.swell-map-now__label { color: var(--mist); }
.swell-map-now__list { color: var(--ink); letter-spacing: 0.10em; }
.swell-map-now__list a { color: var(--ink); text-decoration: none; border-bottom: 1px solid var(--border); }
.swell-map-now__list a:hover { color: var(--wave); border-color: var(--wave); }

/* ---- LOGBOOK SECTION ---- */
.section--logbook {
  background: var(--sand);
  padding: 80px 0 56px;
}
.section--logbook .section__intro { padding: 0 40px 48px; }

.log-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 40px 32px;
  padding: 0 40px;
}

.log-cell {
  position: relative;
  display: flex;
  flex-direction: column;
  gap: 16px;
  text-decoration: none;
  color: inherit;
  cursor: pointer;
  transition: opacity 0.2s var(--ease);
}
.log-cell:hover { opacity: 0.85; }
.log-cell--link { cursor: pointer; }
.log-cell--upcoming { opacity: 0.65; }
.log-cell--upcoming:hover { opacity: 0.55; }

.log-cell__tile {
  position: relative;
  width: 100%;
  overflow: hidden;
  border-radius: 4px;
  aspect-ratio: 4 / 5;
  background: var(--mist);
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--serif);
  font-size: 64px;
  color: rgba(15,110,86,0.20);
  font-style: italic;
  letter-spacing: -0.02em;
}

.log-cell__pip {
  position: absolute;
  top: 10px;
  left: 10px;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  background: rgba(254,253,251,0.92);
  border: 1px solid var(--border);
  border-radius: 2px;
  font-family: var(--mono);
  font-size: 8px;
  letter-spacing: 0.20em;
  text-transform: uppercase;
  color: var(--ink);
  z-index: 2;
}
.log-cell__pip::before {
  content: '';
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--wave);
}
.log-cell--upcoming .log-cell__pip {
  color: var(--mist);
}
.log-cell--upcoming .log-cell__pip::before {
  background: transparent;
  border: 1px solid var(--mist);
  width: 5px;
  height: 5px;
}

.log-cell__ig-corner {
  position: absolute;
  bottom: 10px;
  right: 10px;
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(254,253,251,0.92);
  border: 1px solid var(--border);
  border-radius: 2px;
  color: var(--wave);
  z-index: 2;
  opacity: 1;
  transition: opacity 0.2s var(--ease);
}
@media (hover: hover) {
  .log-cell__ig-corner { opacity: 0; }
  .log-cell--link:hover .log-cell__ig-corner { opacity: 1; }
}
.log-cell__ig-corner svg { width: 14px; height: 14px; }

.log-cell__caption {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 0 2px;
}
.log-cell__month {
  font-family: var(--mono);
  font-size: 9px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--mist);
}
.log-cell__location {
  font-family: var(--serif);
  font-style: italic;
  font-size: 16px;
  letter-spacing: -0.01em;
  color: var(--ink);
  line-height: 1.2;
}
.log-cell--upcoming .log-cell__location {
  color: var(--mist);
}

@media (max-width: 1199px) {
  .section--logbook { padding: 60px 0 48px; }
  .log-grid { grid-template-columns: repeat(2, 1fr); padding: 0 24px; gap: 24px 16px; }
}
@media (max-width: 720px) {
  .log-grid { grid-template-columns: 1fr; gap: 32px; }
}

/* ---- ETHOS SECTION ---- */
.section--ethos {
  background: var(--sand);
  padding: 80px 40px 0;
}
.section--ethos .section__h { color: var(--ink); }
